name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  frontend-dist:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify dependency files
        run: |
          echo "=== Git commit ==="
          git rev-parse HEAD

          echo "=== package.json TypeScript ==="
          grep '"typescript"' package.json

          echo "=== package-lock.json TypeScript ==="
          grep -A 4 '"node_modules/typescript"' package-lock.json

          echo "=== Node/npm versions ==="
          node --version
          npm --version

          echo "=== Lockfile version ==="
          grep '"lockfileVersion"' package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --run

      - name: Build production bundle
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist