name: Docker Images

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

  BACKEND_IMAGE: task-orchestrator-backend
  FRONTEND_IMAGE: task-orchestrator-frontend

jobs:
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # QEMU
      #
      # Required because GitHub's standard runner is amd64
      # and we are also building linux/arm64 images.
      # ---------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      # ---------------------------------------------------------
      # Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---------------------------------------------------------
      # Verify Docker / Buildx
      # ---------------------------------------------------------
      - name: Verify Docker Buildx
        run: |
          docker version
          docker buildx version
          docker buildx inspect --bootstrap

      # ---------------------------------------------------------
      # Determine Docker version
      # ---------------------------------------------------------
      - name: Determine Docker version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=""
          fi

          echo "VERSION=${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      #---------------------------------------------------------
      # GHCR credentials 
      # ---------------------------------------------------------
      - name: Login to GHCR
        if: >
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ---------------------------------------------------------
      # AWS credentials through GitHub OIDC
      #
      # PR:
      #   Do NOT authenticate to ECR
      #
      # main:
      #   Authenticate
      #
      # v1.0.0:
      #   Authenticate
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        if: >
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify GitHub context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"

      - name: Inspect OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            ref,
            event_name
          }'
      # ---------------------------------------------------------
      # Login to ECR
      # ---------------------------------------------------------
      - name: Login to Amazon ECR
        if: >
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------
      # Docker metadata - Backend
      #
      # main:
      #   latest
      #   sha-xxxxxxxx
      #
      # v1.0.0:
      #   1.0.0
      #   1.0
      #   sha-xxxxxxxx
      # ---------------------------------------------------------
      - name: Docker metadata - backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/task-orchestrator-backend
          tags: |
              type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
              type=sha,prefix=sha-
              type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
              
      # ---------------------------------------------------------
      # Docker metadata - Frontend
      # ---------------------------------------------------------
      - name: Docker metadata - frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: | 
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/task-orchestrator-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}

      # ---------------------------------------------------------
      # Build / Push Backend
      #
      # PR:
      #   Build only
      #
      # main:
      #   Build + Push
      #
      # v1.0.0:
      #   Build + Push
      # ---------------------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64

          push: >
            ${{ github.event_name == 'push' &&
            (
              github.ref == 'refs/heads/main' ||
              startsWith(github.ref, 'refs/tags/v')
            ) }}

          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # Build / Push Frontend
      # ---------------------------------------------------------
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64

          push: >
            ${{ github.event_name == 'push' &&
            (
              github.ref == 'refs/heads/main' ||
              startsWith(github.ref, 'refs/tags/v')
            ) }}

          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          
          cache-from: type=gha
          cache-to: type=gha,mode=max
