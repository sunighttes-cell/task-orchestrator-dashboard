
services:
  postgres:
    image: postgres:15
    container_name: taskapp-postgres
    restart: always
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: taskapp-backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskdb
      SPRING_DATASOURCE_USERNAME: taskuser
      SPRING_DATASOURCE_PASSWORD: taskpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: link-wonder-window-securl-918273645
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: taskapp-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data: