services:
  # --------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------
  postgres:
    image: postgres:15
    container_name: taskapp-postgres
    restart: always

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U taskuser -d taskdb"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # --------------------------------------------------
  # Spring Boot Backend
  # --------------------------------------------------
  backend:
    build:
      context: ./backend

    container_name: taskapp-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskdb
      SPRING_DATASOURCE_USERNAME: taskuser
      SPRING_DATASOURCE_PASSWORD: taskpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/actuator/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  # --------------------------------------------------
  # React / Nginx Frontend
  # --------------------------------------------------
  frontend:
    build:
      context: ./frontend

    container_name: taskapp-frontend

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "3000:80"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


volumes:
  postgres_data: